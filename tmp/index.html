<style>
:root{--bg:#071019;--panel:#101e2b;--edge:#253b4d;--text:#f3f7fb;--muted:#91a4b5;--accent:#77ddb5}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#071019,#0a1420 42%,#08111a);color:var(--text);font:15px Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
main{width:min(1380px,calc(100% - 32px));margin:auto;padding:30px 0 56px}
header{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:18px}
.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
h1{font-size:clamp(26px,4vw,42px);letter-spacing:-.035em;margin:5px 0 0}.window{color:var(--muted);font-variant-numeric:tabular-nums}
.video-shell{background:#000;border:1px solid var(--edge);border-radius:16px;overflow:hidden;box-shadow:0 18px 60px #0008;aspect-ratio:16/9}
#player{width:100%;height:100%}
.serve-note{display:none;margin:0 0 12px;padding:11px 13px;border:1px solid #9d7124;border-radius:10px;background:#2b220d;color:#f6dfaa;font-size:13px}
.serve-note code{color:#fff3c9}
.timeline-card{margin-top:20px;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--edge);border-radius:16px;padding:18px;box-shadow:0 15px 45px #0004}
.timeline-head{display:grid;grid-template-columns:74px 1fr;gap:12px;align-items:end;margin-bottom:10px}
.timeline-head h2{font-size:20px;margin:0}.ticks{position:relative;height:22px;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.tick{position:absolute;transform:translateX(-50%)}.tick:first-child{transform:none}.tick:last-child{transform:translateX(-100%)}
#lanes{display:grid;gap:8px}.lane{display:grid;grid-template-columns:74px 1fr;gap:12px;align-items:center}
.portrait{width:58px;height:68px;margin:auto;display:block;border-radius:9px;object-fit:cover;object-position:center top;background:#081019;border:2px solid var(--lane-color);box-shadow:0 4px 14px #0008;cursor:pointer}
.track{height:34px;border:1px solid #2a4052;border-radius:8px;position:relative;overflow:hidden;cursor:pointer;background:repeating-linear-gradient(90deg,#0a1520 0,#0a1520 calc(20% - 1px),#213344 calc(20% - 1px),#213344 20%)}
.span{position:absolute;top:7px;height:18px;min-width:2px;border-radius:5px;background:var(--lane-color);box-shadow:0 0 14px color-mix(in srgb,var(--lane-color) 42%,transparent)}
#playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 7px #fff;z-index:3;pointer-events:none;display:none}
.legend{display:flex;justify-content:space-between;gap:16px;margin:15px 0 0 86px;color:var(--muted);font-size:12px}
.legend b{color:var(--text);font-variant-numeric:tabular-nums}button{appearance:none;border:1px solid #33516a;background:#162a3a;color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer}button:hover{border-color:var(--accent)}
@media(max-width:700px){main{width:min(100% - 18px,1380px);padding-top:14px}header{align-items:start;flex-direction:column}.timeline-card{padding:10px}.timeline-head,.lane{grid-template-columns:52px 1fr;gap:7px}.portrait{width:44px;height:52px}.legend{margin-left:59px}}
</style>

const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
const lanes=document.getElementById('lanes'),ticks=document.getElementById('ticks'),clock=document.getElementById('clock');
for(let i=0;i<=5;i++){const tick=document.createElement('span');tick.className='tick';tick.style.left=`${i*20}%`;tick.textContent=fmt(DATA.duration*i/5);ticks.append(tick)}
DATA.people.forEach((person,index)=>{const lane=document.createElement('div');lane.className='lane';lane.style.setProperty('--lane-color',palette[index%palette.length]);lane.innerHTML=`<img class="portrait" src="${person.image}" alt="Player crop" title="${person.name}"><div class="track" title="Click to seek"><div class="playhead"></div>${person.runs.map(run=>`<span class="span" style="left:${run.left}%;width:${run.width}%"></span>`).join('')}</div>`;const track=lane.querySelector('.track');const seek=event=>{const box=track.getBoundingClientRect(),local=Math.max(0,Math.min(DATA.duration,(event.clientX-box.left)/box.width*DATA.duration));seekTo(local)};track.addEventListener('click',seek);lane.querySelector('.portrait').addEventListener('click',()=>seekTo(person.first));lanes.append(lane)});
let player=null,ready=false;
if(location.protocol==='file:')document.getElementById('serve-note').style.display='block';
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('player',{videoId:DATA.videoId,playerVars:{start:Math.round(DATA.start),playsinline:1,rel:0,origin:location.protocol==='file:'?undefined:location.origin},events:{onReady:()=>{ready=true;player.cueVideoById({videoId:DATA.videoId,startSeconds:DATA.start})}}})};
function seekTo(local){if(!ready)return;player.seekTo(DATA.start+local,true);player.playVideo()}
function update(){if(ready&&player.getCurrentTime){const local=player.getCurrentTime()-DATA.start;clock.textContent=fmt(Math.max(0,Math.min(DATA.duration,local)));document.querySelectorAll('.playhead').forEach(line=>{if(local>=0&&local<=DATA.duration){line.style.display='block';line.style.left=`${100*local/DATA.duration}%`}else line.style.display='none'})}requestAnimationFrame(update)}update();
